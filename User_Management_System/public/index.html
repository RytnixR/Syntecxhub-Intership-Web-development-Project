<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">

        <!-- Auth Section -->
        <div id="authSection" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <ul class="nav nav-pills nav-justified mb-3" id="pills-tab">
                        <li class="nav-item">
                            <button class="nav-link active" id="loginTabBtn">Login</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="registerTabBtn">Register</button>
                        </li>
                    </ul>

                    <form id="loginForm">
                        <h4 class="mb-3 text-center">Login</h4>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="admin@example.com"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••"
                                required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>

                    <form id="registerForm" class="d-none">
                        <h4 class="mb-3 text-center">Register User Account</h4>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="regName" class="form-control" placeholder="Enter name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="regEmail" class="form-control" placeholder="Enter email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="••••••••"
                                required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Register</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>User Management Dashboard</h2>
                <div>
                    <button id="myPasswordBtn" class="btn btn-outline-primary me-2">Change My Password</button>
                    <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
                </div>
            </div>

            <div class="row g-4">
                <!-- Add User Form (Admin Only View) -->
                <div class="col-md-4" id="addUserCard">
                    <div class="card shadow-sm p-4">
                        <h4 class="card-title mb-3">Add New Account</h4>
                        <form id="userForm">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="name" class="form-control" placeholder="Enter name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Default: 123456">
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select id="role" name="role" class="form-select" aria-label="Select Role">
                                    <option value="User">User</option>
                                    <option value="Admin">Admin</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Create Account</button>
                        </form>
                    </div>
                </div>

                <!-- User List Table with Search & Filter -->
                <div id="userTableCol" class="col-md-8">
                    <div class="card shadow-sm p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="card-title mb-0">All Users</h4>
                            <button id="exportCsvBtn" class="btn btn-sm btn-outline-success">📊 Export CSV</button>
                        </div>

                        <!-- Search and Filter Bar -->
                        <div class="row g-2 mb-3">
                            <div class="col-md-7">
                                <input type="text" id="searchInput" class="form-control"
                                    placeholder="Search by name or email...">
                            </div>
                            <div class="col-md-5">
                                <select id="filterRole" name="filterRole" class="form-select"
                                    aria-label="Filter Users by Role">
                                    <option value="All">All Roles</option>
                                    <option value="User">User Only</option>
                                    <option value="Admin">Admin Only</option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="userTableBody">
                                    <!-- Dynamic Rows -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination Controls -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <small class="text-muted" id="pageInfo">Page 1 of 1</small>
                            <div>
                                <button id="prevBtn" class="btn btn-sm btn-outline-secondary me-1">Previous</button>
                                <button id="nextBtn" class="btn btn-sm btn-outline-secondary">Next</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Admin Edit User Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit User Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editUserId" name="editUserId">
                        <div class="mb-3">
                            <label for="editName" class="form-label">Full Name</label>
                            <input type="text" id="editName" name="editName" class="form-control"
                                placeholder="Enter full name" required aria-label="Full Name" autocomplete="name">
                        </div>
                        <div class="mb-3">
                            <label for="editEmail" class="form-label">Email Address</label>
                            <input type="email" id="editEmail" name="editEmail" class="form-control"
                                placeholder="Enter email" required aria-label="Email Address" autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="editRole" class="form-label">Role</label>
                            <select id="editRole" name="editRole" class="form-select" aria-label="Select Role">
                                <option value="User">User</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editPassword" class="form-label">New Password</label>
                            <input type="password" id="editPassword" name="editPassword" class="form-control"
                                placeholder="Leave blank to keep unchanged" aria-label="New Password"
                                autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Change My Password Modal -->
    <div class="modal fade" id="myPasswordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Change My Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="myPasswordForm">
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" id="myNewPassword" class="form-control"
                                placeholder="Enter new password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api/users';
        const AUTH_URL = '/api/auth';
        let editModalInstance;
        let myPasswordModalInstance;

        let currentPage = 1;
        let totalPages = 1;

        document.addEventListener('DOMContentLoaded', () => {
            editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
            myPasswordModalInstance = new bootstrap.Modal(document.getElementById('myPasswordModal'));

            // Attach Event Listeners
            document.getElementById('loginTabBtn').addEventListener('click', () => switchAuthTab('login'));
            document.getElementById('registerTabBtn').addEventListener('click', () => switchAuthTab('register'));
            document.getElementById('myPasswordBtn').addEventListener('click', openMyPasswordModal);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('exportCsvBtn').addEventListener('click', exportToCSV);

            document.getElementById('searchInput').addEventListener('input', handleFilterChange);
            document.getElementById('filterRole').addEventListener('change', handleFilterChange);

            document.getElementById('prevBtn').addEventListener('click', () => changePage(-1));
            document.getElementById('nextBtn').addEventListener('click', () => changePage(1));

            checkAuth();
        });

        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const regBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('d-none');
                registerForm.classList.add('d-none');
                loginBtn.classList.add('active');
                regBtn.classList.remove('active');
            } else {
                loginForm.classList.add('d-none');
                registerForm.classList.remove('d-none');
                loginBtn.classList.remove('active');
                regBtn.classList.add('active');
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('authSection').classList.add('d-none');
                document.getElementById('dashboardSection').classList.remove('d-none');

                const currentUserRole = localStorage.getItem('userRole');
                const addUserCard = document.getElementById('addUserCard');
                const userTableCol = document.getElementById('userTableCol');

                if (currentUserRole === 'Admin') {
                    addUserCard.classList.remove('d-none');
                    userTableCol.className = 'col-md-8';
                } else {
                    addUserCard.classList.add('d-none');
                    userTableCol.className = 'col-md-12';
                }

                fetchUsers();
            } else {
                document.getElementById('authSection').classList.remove('d-none');
                document.getElementById('dashboardSection').classList.add('d-none');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const res = await fetch(`${AUTH_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const result = await res.json();
            if (res.ok) {
                localStorage.setItem('token', result.data.token);
                localStorage.setItem('userRole', result.data.role);
                localStorage.setItem('userId', result.data._id);
                checkAuth();
            } else {
                alert(result.message || 'Login failed');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            const res = await fetch(`${AUTH_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            const result = await res.json();
            if (res.ok) {
                localStorage.setItem('token', result.data.token);
                localStorage.setItem('userRole', result.data.role);
                localStorage.setItem('userId', result.data._id);
                checkAuth();
            } else {
                alert(result.message || 'Registration failed');
            }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userRole');
            localStorage.removeItem('userId');
            checkAuth();
        }

        async function fetchUsers() {
            const search = document.getElementById('searchInput').value;
            const role = document.getElementById('filterRole').value;

            const url = `${API_URL}?search=${encodeURIComponent(search)}&role=${role}&page=${currentPage}&limit=5`;

            const res = await fetch(url, { headers: getAuthHeaders() });
            const result = await res.json();

            if (!res.ok) {
                if (res.status === 401) logout();
                return;
            }

            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (!result.data || result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No users found</td></tr>';
            } else {
                const currentUserRole = localStorage.getItem('userRole');
                result.data.forEach(user => {
                    const actionContent = currentUserRole === 'Admin'
                        ? `<button onclick="openEditModal('${user._id}', '${user.name}', '${user.email}', '${user.role}')" class="btn btn-sm btn-outline-warning me-1">Edit</button>
               <button onclick="deleteUser('${user._id}')" class="btn btn-sm btn-outline-danger">Delete</button>`
                        : `<span class="badge bg-light text-dark border">Read Only</span>`;

                    tbody.innerHTML += `
            <tr>
              <td>${user.name}</td>
              <td>${user.email}</td>
              <td><span class="badge ${user.role === 'Admin' ? 'bg-danger' : 'bg-secondary'}">${user.role}</span></td>
              <td>${actionContent}</td>
            </tr>
          `;
                });
            }

            if (result.pagination) {
                totalPages = result.pagination.totalPages;
                document.getElementById('pageInfo').innerText = `Page ${result.pagination.currentPage} of ${totalPages} (${result.pagination.totalUsers} total)`;
                document.getElementById('prevBtn').disabled = currentPage <= 1;
                document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            }
        }

        function handleFilterChange() {
            currentPage = 1;
            fetchUsers();
        }

        function changePage(direction) {
            currentPage += direction;
            fetchUsers();
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ name, email, password, role })
            });

            const data = await res.json();
            if (res.ok) {
                document.getElementById('userForm').reset();
                fetchUsers();
            } else {
                alert(data.message || 'Error adding account');
            }
        });

        function openMyPasswordModal() {
            document.getElementById('myNewPassword').value = '';
            myPasswordModalInstance.show();
        }

        document.getElementById('myPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = localStorage.getItem('userId');
            const password = document.getElementById('myNewPassword').value;

            const res = await fetch(`${API_URL}/${userId}`, {
                method: 'PUT',
                headers: getAuthHeaders(),
                body: JSON.stringify({ password })
            });

            const data = await res.json();
            if (res.ok) {
                alert('Password updated successfully!');
                myPasswordModalInstance.hide();
            } else {
                alert(data.message || 'Error updating password');
            }
        });

        function openEditModal(id, name, email, role) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editEmail').value = email;
            document.getElementById('editRole').value = role;
            document.getElementById('editPassword').value = '';
            editModalInstance.show();
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const name = document.getElementById('editName').value;
            const email = document.getElementById('editEmail').value;
            const role = document.getElementById('editRole').value;
            const password = document.getElementById('editPassword').value;

            const res = await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: getAuthHeaders(),
                body: JSON.stringify({ name, email, role, password })
            });

            const data = await res.json();
            if (res.ok) {
                editModalInstance.hide();
                fetchUsers();
            } else {
                alert(data.message || 'Error updating user');
            }
        });

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (res.ok) {
                    fetchUsers();
                } else {
                    alert(data.message || 'Error deleting user (Admin required)');
                }
            }
        }

        async function exportToCSV() {
            try {
                const res = await fetch(`${API_URL}?limit=1000`, { headers: getAuthHeaders() });
                const result = await res.json();

                if (!res.ok || !result.data || result.data.length === 0) {
                    return alert('No user data available to export.');
                }

                let csvContent = 'data:text/csv;charset=utf-8,User ID,Full Name,Email Address,Role,Created At\n';

                result.data.forEach(user => {
                    const createdAt = new Date(user.createdAt).toLocaleDateString();
                    csvContent += `"${user._id}","${user.name}","${user.email}","${user.role}","${createdAt}"\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement('a');
                link.setAttribute('href', encodedUri);
                link.setAttribute('download', `User_Report_${new Date().toISOString().slice(0, 10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            } catch (error) {
                alert('Error exporting CSV: ' + error.message);
            }
        }
    </script>
</body>

</html>
